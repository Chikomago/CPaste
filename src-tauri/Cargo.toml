[package]
name = "cpaste"
version = "0.1.1"
license = "GPL-3.0-only"
authors = ["chikomago"]
repository = "https://github.com/Chikomago/CPaste"
description = "Local clipboard history for macOS and Windows"
edition = "2021"

[lib]
name = "cpaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
clipboard-rs = "0.3.5"
active-win-pos-rs = "0.11"
enigo = "0.6"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rfd = "0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
plist = "1.10"
regex = "1"
jieba-rs = { version = "0.11", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSRunningApplication", "NSWorkspace", "libc"] }
tauri-nspanel = "=2.1.1"
